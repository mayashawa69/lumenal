<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumenal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;1,400;1,500&family=Tajawal:wght@300;400;500;700&family=Heebo:wght@300;400;500;700&family=Frank+Ruhl+Libre:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    --ink:#0F0E0D; --ink-2:#181513; --bone:#ECE6DA; --bone-dim:#a79c8c; --brass:#B08D57;
    --line: rgba(236,230,218,0.14);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior:smooth;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{font-family:'Tajawal',sans-serif;color:var(--bone);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  body.locked{overflow:hidden;}
  img{max-width:100%;display:block;}
  .wordmark{font-family:'Cinzel',serif;letter-spacing:0.16em;direction:ltr;text-transform:uppercase;}
  .quote-en{font-family:'Cormorant Garamond',serif;font-style:italic;direction:ltr;text-align:start;}
  a{color:inherit;}
  section{padding:5rem 1.5rem;}
  .wrap{max-width:640px;margin:0 auto;}

  /* HEBREW FONT OVERRIDES */
  body[data-lang="he"]{font-family:'Heebo',sans-serif;}
  body[data-lang="he"] .story .tag, body[data-lang="he"] .duo h4{font-family:'Frank Ruhl Libre',serif;}
  body[data-lang="he"] .p-tag, body[data-lang="he"] .scroll-hint, body[data-lang="he"] .contact-line,
  body[data-lang="he"] .ship-note, body[data-lang="he"] .fine, body[data-lang="he"] .cta,
  body[data-lang="he"] .cart-form input, body[data-lang="he"] .cart-form textarea{font-family:'Heebo',sans-serif;}

  /* LANG TOGGLE */
  .lang-group{
    position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));inset-inline-start:1rem;z-index:60;
    display:flex;gap:2px;background:rgba(15,14,13,0.55);border:1px solid var(--brass);
    border-radius:999px;padding:3px;
  }
  .lang-group button{
    border:none;background:none;color:var(--bone-dim);font-family:'Cinzel',serif;
    font-size:0.62rem;letter-spacing:0.02em;padding:0.42rem 0.5rem;border-radius:999px;cursor:pointer;
  }
  .lang-group button.active{background:var(--brass);color:var(--ink);}

  /* HERO / VIDEO REEL */
  .reel{position:relative;height:100svh;overflow:hidden;}
  .reel-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .reel-overlay{
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(15,14,13,0.55) 0%, rgba(15,14,13,0.35) 40%, rgba(15,14,13,0.85) 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem;
  }
  .reel-overlay .wordmark{font-size:clamp(2.6rem, 11vw, 5.2rem);font-weight:500;color:var(--bone);margin:0;}
  .reel-overlay .tag-en{margin-top:1rem;font-size:1.15rem;color:var(--bone);}
  .reel-overlay .tag-ar{margin-top:0.4rem;font-size:0.92rem;color:var(--bone-dim);}
  .rule{width:34px;height:1px;background:var(--brass);margin:2rem auto;}
  .scroll-hint{position:absolute;bottom:calc(1.6rem + env(safe-area-inset-bottom,0px));font-size:0.72rem;color:var(--bone-dim);letter-spacing:0.08em;left:0;right:0;text-align:center;}
  .sound-toggle{
    position:absolute;bottom:calc(4.2rem + env(safe-area-inset-bottom,0px));inset-inline-end:1.2rem;
    width:44px;height:44px;border-radius:50%;border:1px solid var(--brass);
    background:rgba(15,14,13,0.45);color:var(--bone);font-size:1.05rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5;
  }

  /* STORY */
  .story{background:var(--ink-2);text-align:center;}
  .story .quote-en{font-size:clamp(1.2rem,3.4vw,1.55rem);line-height:1.7;color:var(--bone);max-width:34ch;margin:0 auto;text-align:center;}
  .story .quote-body{margin-top:1.3rem;font-size:0.95rem;line-height:1.9;color:var(--bone-dim);max-width:36ch;margin-inline:auto;}
  .story .tag{display:block;margin-top:2rem;font-size:0.85rem;color:var(--brass);}

  /* PHILOSOPHY */
  .philosophy ul{list-style:none;padding:0;margin:0;max-width:480px;margin-inline:auto;}
  .philosophy li{padding:1rem 0;border-top:1px solid var(--line);font-size:0.98rem;line-height:1.7;color:var(--bone-dim);}
  .philosophy li:last-child{border-bottom:1px solid var(--line);}

  /* PRODUCTS */
  .product{max-width:520px;margin:0 auto;padding:3.4rem 0;border-top:1px solid var(--line);}
  .products .product:last-child{border-bottom:1px solid var(--line);}
  .p-gallery{display:flex;gap:0.6rem;overflow-x:auto;scroll-snap-type:x mandatory;margin-bottom:1.8rem;padding-bottom:0.3rem;-webkit-overflow-scrolling:touch;}
  .p-gallery::-webkit-scrollbar{height:3px;}
  .p-gallery::-webkit-scrollbar-thumb{background:var(--line);}
  .p-gallery img{flex:0 0 82%;scroll-snap-align:start;aspect-ratio:3/4;object-fit:cover;border-radius:2px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);cursor:pointer;}
  .p-tag{font-size:0.76rem;letter-spacing:0.04em;margin:0 0 0.4rem;}
  .p-name{font-family:'Cinzel',serif;font-size:1.7rem;font-weight:500;margin:0 0 1rem;direction:ltr;text-align:start;letter-spacing:0.04em;}
  .p-quote{font-size:1.05rem;line-height:1.8;color:var(--bone);margin:0 0 1.3rem;}
  .p-price{display:flex;align-items:baseline;gap:0.7rem;margin:0 0 1.1rem;}
  .p-price .old{font-size:0.95rem;color:#D9534F;text-decoration:line-through;}
  .p-price .new{font-family:'Cinzel',serif;font-size:1.3rem;color:#4CAF6D;letter-spacing:0.02em;}
  .p-price .badge{font-size:0.72rem;color:var(--ink);padding:0.15rem 0.55rem;border-radius:2px;letter-spacing:0.02em;}
  .cta{display:inline-block;font-size:0.88rem;background:none;border:none;padding:0 0 2px;text-decoration:none;font-family:'Tajawal',sans-serif;cursor:pointer;border-bottom:1px solid currentColor;}
  .p-size{font-size:0.8rem;color:var(--bone-dim);margin-inline-start:1rem;}

  /* USAGE / CARE */
  .duo{background:var(--ink-2);}
  .duo .wrap{display:grid;gap:2.4rem;}
  .duo h4{font-family:'Cinzel',serif;font-size:1.05rem;font-weight:500;margin:0 0 0.7rem;letter-spacing:0.05em;}
  .duo p{font-size:0.95rem;line-height:1.85;color:var(--bone-dim);margin:0;}
  @media(min-width:600px){ .duo .wrap{grid-template-columns:1fr 1fr;} }

  footer{text-align:center;padding:4.5rem 1.5rem calc(3rem + env(safe-area-inset-bottom, 0px));}
  footer .wordmark{font-size:1.1rem;color:var(--bone-dim);display:block;margin-bottom:1.6rem;}
  .contact-line{font-size:1.05rem;margin-bottom:0.6rem;}
  .contact-line a{border-bottom:1px solid var(--brass);text-decoration:none;}
  .ship-note{font-size:0.82rem;color:var(--bone-dim);margin-top:1.8rem;}
  .fine{font-size:0.72rem;color:#5f584d;margin-top:2.4rem;}

  /* PRODUCT DETAIL OVERLAY */
  .overlay{
    position:fixed;inset:0;background:var(--ink);z-index:100;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    opacity:0;pointer-events:none;transition:opacity 0.25s ease;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .overlay-inner{max-width:560px;margin:0 auto;padding:1.4rem 1.5rem 4rem;}
  .overlay-top{display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0 1.6rem;}
  .overlay-top .wordmark{font-size:0.95rem;color:var(--bone-dim);}
  .overlay-close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--bone);font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .overlay-photos{display:flex;gap:0.7rem;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin-bottom:1rem;padding-bottom:0.3rem;}
  .overlay-photos::-webkit-scrollbar{height:3px;}
  .overlay-photos::-webkit-scrollbar-thumb{background:var(--line);}
  .overlay-photos img{flex:0 0 88%;scroll-snap-align:start;aspect-ratio:3/4;object-fit:cover;border-radius:2px;box-shadow:0 30px 60px -20px rgba(0,0,0,0.6);}
  .overlay .p-name{margin-top:1.6rem;}
  .wa-order, .cart-btn-order{
    display:flex;align-items:center;justify-content:center;gap:0.6rem;
    width:100%;margin-top:0.6rem;padding:1rem;border-radius:4px;
    background:var(--brass);color:var(--ink);border:none;
    font-family:'Tajawal',sans-serif;font-weight:500;font-size:1rem;
    text-decoration:none;cursor:pointer;
  }

  /* CART ICON */
  .cart-toggle{
    position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));inset-inline-end:1rem;z-index:60;
    width:42px;height:42px;border-radius:50%;border:1px solid var(--brass);
    background:rgba(15,14,13,0.55);color:var(--bone);font-size:1.1rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .cart-badge{
    position:absolute;top:-4px;inset-inline-end:-4px;
    background:#4CAF6D;color:var(--ink);font-size:0.65rem;font-weight:700;
    min-width:17px;height:17px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;padding:0 2px;
  }

  /* CART OVERLAY */
  .cart-item{display:flex;gap:0.8rem;align-items:center;padding:0.9rem 0;border-top:1px solid var(--line);}
  .cart-item img{width:56px;height:70px;object-fit:cover;border-radius:2px;flex:0 0 auto;}
  .cart-item .ci-name{font-family:'Cinzel',serif;font-size:0.92rem;direction:ltr;text-align:start;}
  .cart-item .ci-price{font-size:0.82rem;color:var(--bone-dim);margin-top:0.2rem;}
  .cart-item .ci-qty{display:flex;align-items:center;gap:0.5rem;margin-inline-start:auto;}
  .ci-qty button{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--bone);cursor:pointer;font-size:0.9rem;}
  .ci-remove{background:none;border:none;color:#D9534F;font-size:0.85rem;cursor:pointer;margin-inline-start:0.6rem;}
  .cart-summary{border-top:1px solid var(--line);margin-top:0.6rem;padding-top:1rem;}
  .cart-summary .row{display:flex;justify-content:space-between;font-size:0.92rem;color:var(--bone-dim);padding:0.3rem 0;}
  .cart-summary .row.total{color:var(--bone);font-size:1.1rem;font-family:'Cinzel',serif;}
  .cart-form{margin-top:1.6rem;display:flex;flex-direction:column;gap:0.8rem;}
  .cart-form input, .cart-form textarea{
    width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:4px;
    color:var(--bone);font-family:'Tajawal',sans-serif;font-size:0.95rem;padding:0.8rem;
  }
  .cart-form textarea{resize:vertical;min-height:64px;}
  .cart-empty{color:var(--bone-dim);font-size:0.92rem;padding:2rem 0;text-align:center;}
</style>
</head>

  var PRODUCT_NAMES = { noir: "NOIR DESIRE", crave: "CRAVE ME", magnetic: "MAGNETIC HUG" };
  var currentLang = "ar";

  function applyLang(lang){
    currentLang = lang;
    var dict = I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "en" ? "ltr" : "rtl";
    document.body.setAttribute("data-lang", lang);
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var key = el.getAttribute("data-i18n");
      if(dict[key] !== undefined){ el.textContent = dict[key]; }
    });
    document.querySelectorAll("[data-i18n-ph]").forEach(function(el){
      var key = el.getAttribute("data-i18n-ph");
      if(dict[key] !== undefined){ el.setAttribute("placeholder", dict[key]); }
    });
    document.querySelectorAll("#langGroup button").forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-lang-btn") === lang);
    });
    if(overlayCurrentKey){ openProduct(overlayCurrentKey); }
    if(typeof renderCart === "function"){ renderCart(); }
  }

  document.querySelectorAll("#langGroup button").forEach(function(btn){
    btn.addEventListener("click", function(){ applyLang(btn.getAttribute("data-lang-btn")); });
  });

  document.querySelectorAll(".p-gallery").forEach(function(el){
    var key = el.getAttribute("data-product");
    PHOTOS[key].slice(0,3).forEach(function(b64){
      var img = document.createElement("img");
      img.src = b64;
      img.alt = PRODUCT_NAMES[key];
      img.addEventListener("click", function(){ openProduct(key); });
      el.appendChild(img);
    });
  });

  var overlay = document.getElementById("productOverlay");
  var ovPhotos = document.getElementById("overlayPhotos");
  var ovTag = document.getElementById("overlayTag");
  var ovName = document.getElementById("overlayName");
  var ovQuote = document.getElementById("overlayQuote");
  var overlayCurrentKey = null;
  var quoteKeyMap = { noir:"quoteNoir", crave:"quoteCrave", magnetic:"quoteMagnetic" };
  var tagKeyMap = { noir:"tagNoir", crave:"tagCrave", magnetic:"tagMagnetic" };
  var accentMap = { noir:"#C9A17E", crave:"#C96B5A", magnetic:"#D8CDBB" };

  function openProduct(key){
    overlayCurrentKey = key;
    var dict = I18N[currentLang];
    ovPhotos.innerHTML = "";
    PHOTOS[key].forEach(function(b64){
      var img = document.createElement("img");
      img.src = b64;
      img.alt = PRODUCT_NAMES[key];
      ovPhotos.appendChild(img);
    });
    ovTag.textContent = dict[tagKeyMap[key]];
    ovTag.style.color = accentMap[key];
    ovName.textContent = PRODUCT_NAMES[key];
    ovQuote.textContent = dict[quoteKeyMap[key]];
    document.getElementById("overlayBadge").style.background = accentMap[key];
    document.getElementById("overlayAdd").textContent = dict.addToCart;
    overlay.classList.add("open");
    document.body.classList.add("locked");
    overlay.scrollTop = 0;
  }

  document.querySelectorAll("[data-open]").forEach(function(btn){
    btn.addEventListener("click", function(){ openProduct(btn.getAttribute("data-open")); });
  });
  document.getElementById("overlayClose").addEventListener("click", function(){
    overlay.classList.remove("open");
    document.body.classList.remove("locked");
  });

  var v = document.getElementById("heroVideo");
  var soundBtn = document.getElementById("heroPlayBtn");
  soundBtn.addEventListener("click", function(){
    v.muted = !v.muted;
    if(!v.muted){ v.play(); }
    soundBtn.querySelector(".ic").textContent = v.muted ? "🔊" : "🔇";
    soundBtn.setAttribute("aria-label", I18N[currentLang][v.muted ? "soundOn" : "soundOff"]);
  });
  document.addEventListener("touchstart", function once(){ v.play().catch(function(){}); document.removeEventListener("touchstart", once); }, {once:true});

  /* ---------- CART ---------- */
  var PRICE = 449;
  var DELIVERY = 30;
  var CART = []; // {key, qty}
  var cartOverlay = document.getElementById("cartOverlay");
  var cartToggle = document.getElementById("cartToggle");
  var cartBadge = document.getElementById("cartBadge");
  var cartItemsEl = document.getElementById("cartItems");
  var cartSummaryEl = document.getElementById("cartSummary");

  function cartCount(){ return CART.reduce(function(s,i){ return s+i.qty; }, 0); }
  function cartSubtotal(){ return CART.reduce(function(s,i){ return s+i.qty*PRICE; }, 0); }

  function addToCart(key){
    var existing = CART.find(function(i){ return i.key===key; });
    if(existing){ existing.qty++; } else { CART.push({key:key, qty:1}); }
    updateBadge();
  }
  function changeQty(key, delta){
    var item = CART.find(function(i){ return i.key===key; });
    if(!item) return;
    item.qty += delta;
    if(item.qty <= 0){ CART = CART.filter(function(i){ return i.key!==key; }); }
    renderCart();
  }
  function removeItem(key){
    CART = CART.filter(function(i){ return i.key!==key; });
    renderCart();
  }
  function updateBadge(){
    var c = cartCount();
    cartBadge.textContent = c;
    cartBadge.style.display = c > 0 ? "flex" : "none";
  }

  function renderCart(){
    var dict = I18N[currentLang];
    updateBadge();
    cartItemsEl.innerHTML = "";
    if(CART.length === 0){
      cartItemsEl.innerHTML = '<p class="cart-empty">' + dict.cartEmpty + '</p>';
      cartSummaryEl.style.display = "none";
      return;
    }
    cartSummaryEl.style.display = "block";
    CART.forEach(function(item){
      var row = document.createElement("div");
      row.className = "cart-item";
      var img = document.createElement("img");
      img.src = PHOTOS[item.key][0];
      row.appendChild(img);
      var info = document.createElement("div");
      info.innerHTML = '<div class="ci-name">' + PRODUCT_NAMES[item.key] + '</div><div class="ci-price">₪' + PRICE + '</div>';
      row.appendChild(info);
      var qtyBox = document.createElement("div");
      qtyBox.className = "ci-qty";
      var minus = document.createElement("button"); minus.textContent = "−";
      minus.addEventListener("click", function(){ changeQty(item.key, -1); });
      var qtyLabel = document.createElement("span"); qtyLabel.textContent = item.qty;
      var plus = document.createElement("button"); plus.textContent = "+";
      plus.addEventListener("click", function(){ changeQty(item.key, 1); });
      qtyBox.appendChild(minus); qtyBox.appendChild(qtyLabel); qtyBox.appendChild(plus);
      row.appendChild(qtyBox);
      var rm = document.createElement("button"); rm.className = "ci-remove"; rm.textContent = "✕";
      rm.addEventListener("click", function(){ removeItem(item.key); });
      row.appendChild(rm);
      cartItemsEl.appendChild(row);
    });
    var sub = cartSubtotal();
    document.getElementById("sumSubtotal").textContent = "₪" + sub;
    document.getElementById("sumDelivery").textContent = "₪" + DELIVERY;
    document.getElementById("sumTotal").textContent = "₪" + (sub + DELIVERY);
  }

  document.getElementById("overlayAdd").addEventListener("click", function(){
    if(!overlayCurrentKey) return;
    addToCart(overlayCurrentKey);
    var btn = document.getElementById("overlayAdd");
    var original = btn.textContent;
    btn.textContent = I18N[currentLang].added;
    setTimeout(function(){ btn.textContent = original; }, 1200);
  });

  cartToggle.addEventListener("click", function(){
    renderCart();
    cartOverlay.classList.add("open");
    document.body.classList.add("locked");
  });
  document.getElementById("cartClose").addEventListener("click", function(){
    cartOverlay.classList.remove("open");
    document.body.classList.remove("locked");
  });

  document.getElementById("checkoutForm").addEventListener("submit", function(e){
    e.preventDefault();
    var dict = I18N[currentLang];
    var first = document.getElementById("custFirst").value.trim();
    var last = document.getElementById("custLast").value.trim();
    var addr = document.getElementById("custAddress").value.trim();
    if(!first || !last || !addr || CART.length === 0){
      alert(dict.fillFields);
      return;
    }
    var lines = [dict.orderMsgHeader, ""];
    CART.forEach(function(item){
      lines.push("- " + PRODUCT_NAMES[item.key] + " ×" + item.qty + " — ₪" + (item.qty*PRICE));
    });
    lines.push("");
    lines.push(dict.subtotal + ": ₪" + cartSubtotal());
    lines.push(dict.delivery + ": ₪" + DELIVERY);
    lines.push(dict.total + ": ₪" + (cartSubtotal()+DELIVERY));
    lines.push("");
    lines.push(dict.orderMsgName + ": " + first + " " + last);
    lines.push(dict.orderMsgAddress + ": " + addr);
    var msg = encodeURIComponent(lines.join(String.fromCharCode(10)));
    var waUrl = "https://wa.me/972543551527?text=" + msg;
    var link = document.createElement("a");
    link.href = waUrl;
    link.target = "_blank";
    link.rel = "noopener";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });

  applyLang("ar");
</script>
